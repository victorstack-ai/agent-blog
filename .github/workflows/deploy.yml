name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/**'
      - 'blog/**'
      - 'scripts/**'
      - 'docs/**'
      - 'docusaurus.config.ts'
      - 'static/**'
      - 'src/**'
      - 'sidebars.ts'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.event_name == 'push' && 'pages' || format('pr-{0}', github.ref) }}
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Front matter, taxonomy, truncate, link, CTA, script/style and
      # writing-style rules for blog posts (scripts/validate-content.mjs).
      - name: Validate blog content
        run: npm run validate:content

      - name: Typecheck
        run: npm run typecheck

      - name: Build website
        run: npm run build

      - name: Upload artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./build

  deploy:
    name: Deploy
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
